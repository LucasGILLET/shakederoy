name: Build & Push Front Staging to Docker Hub

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t lucasgillet/shakederoy-front:staging --build-arg BACKEND_URL="${{ secrets.BACKEND_URL }}" .
# secrets.STAGING_BACKEND_URL n'existe pas encore, on peut le remplacer par secrets.BACKEND_URL pour l'instant
      - name: Push Docker image
        run: docker push lucasgillet/shakederoy-front:staging
