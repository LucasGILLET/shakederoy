name: Build & Push Front to Docker Hub

on:
  push:
    branches: [front]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t lucasgillet/shakederoy-front:latest . --build-arg BACKEND_URL="${{ secrets.BACKEND_URL }}"

      - name: Push Docker image
        run: docker push lucasgillet/shakederoy-front:latest
